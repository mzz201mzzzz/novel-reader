<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小说阅读">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>小说阅读</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="screen-library" class="screen active">
  <header class="nav-bar">
    <h1 class="nav-title">书架</h1>
    <button class="nav-btn" id="btn-settings" aria-label="设置">⚙</button>
  </header>
  <div class="library-grid" id="library-grid"></div>
  <div class="empty-library" id="empty-library" style="display:none">
    <div class="empty-icon">📚</div>
    <p>书架空空如也</p>
  </div>
</div>

<div id="screen-detail" class="screen">
  <header class="nav-bar">
    <button class="nav-btn nav-back" data-target="screen-library">‹ 书架</button>
    <h1 class="nav-title" id="detail-title">书籍详情</h1>
    <button class="nav-btn" id="btn-detail-share">📤</button>
  </header>
  <div class="detail-content" id="detail-content"></div>
  <div class="detail-actions">
    <button class="btn-primary" id="btn-start-read">开始阅读</button>
    <button class="btn-secondary" id="btn-catalog">目录</button>
  </div>
</div>

<div id="screen-catalog" class="screen">
  <header class="nav-bar">
    <button class="nav-btn nav-back" data-target="screen-detail">‹ 返回</button>
    <h1 class="nav-title">目录</h1>
  </header>
  <div class="catalog-search">
    <input type="text" id="catalog-search-input" placeholder="搜索章节标题..." autocomplete="off">
    <button id="btn-clear-search" style="display:none">✕</button>
  </div>
  <div class="catalog-list" id="catalog-list"></div>
</div>

<div id="screen-reader" class="screen">
  <div class="reader-header" id="reader-header">
    <button class="nav-btn" id="btn-reader-back">‹ 返回</button>
    <span class="reader-chapter-title" id="reader-chapter-title"></span>
    <button class="nav-btn" id="btn-theme-cycle" title="切换背景">🌙</button>
    <button class="nav-btn" id="btn-bookmark">🔖</button>
  </div>
  <div class="reader-content" id="reader-content"></div>
  <div class="reader-progress" id="reader-progress">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-text" id="progress-text">0%</span>
  </div>
  <div class="reader-footer" id="reader-footer">
    <button class="footer-btn" id="btn-prev-chapter">上一章</button>
    <button class="footer-btn" id="btn-reader-catalog">目录</button>
    <button class="footer-btn" id="btn-reader-settings">Aa</button>
    <button class="footer-btn" id="btn-next-chapter">下一章</button>
  </div>
</div>

<div id="settings-panel" class="settings-panel">
  <div class="settings-header">
    <span>阅读设置</span>
    <button class="btn-close" id="btn-close-settings">✕</button>
  </div>
  <div class="settings-body">
    <div class="setting-row">
      <label>字号</label>
      <div class="font-size-controls">
        <button class="btn-fs" id="btn-fs-down">A-</button>
        <span id="font-size-display">18</span>
        <button class="btn-fs" id="btn-fs-up">A+</button>
      </div>
    </div>
    <div class="setting-row">
      <label>背景</label>
      <div class="theme-options" id="theme-options">
        <button class="theme-btn active" data-theme="light" style="background:#fff;color:#333">☀</button>
        <button class="theme-btn" data-theme="sepia" style="background:#f5f0e8;color:#5c4b3c">🍂</button>
        <button class="theme-btn" data-theme="dark" style="background:#1a1a2e;color:#ccc">🌙</button>
        <button class="theme-btn" data-theme="green" style="background:#c8d6c0;color:#2c3e2d">🌿</button>
      </div>
    </div>
    <div class="setting-row">
      <label>行间距</label>
      <div class="font-size-controls">
        <button class="btn-fs" id="btn-lh-down">‒</button>
        <span id="line-height-display">1.8</span>
        <button class="btn-fs" id="btn-lh-up">+</button>
      </div>
    </div>
    <div class="setting-row">
      <label>翻页方式</label>
      <div class="theme-options" id="page-mode-options">
        <button class="theme-btn active" data-mode="scroll">滚动</button>
        <button class="theme-btn" data-mode="page">翻页</button>
      </div>
    </div>
  </div>
</div>

<div id="install-banner" class="install-banner" style="display:none">
  <span>📱 添加到主屏幕，像App一样使用</span>
  <button id="btn-install">如何安装</button>
  <button id="btn-install-close" class="btn-close-sm">✕</button>
</div>

<div id="install-guide" class="install-guide">
  <div class="guide-content">
    <button id="btn-guide-close" class="btn-close-sm">✕</button>
    <h3>📲 安装到 iPhone</h3>
    <div class="guide-steps">
      <div class="step"><span class="step-num">1</span> 用 <b>Safari</b> 打开本页面</div>
      <div class="step"><span class="step-num">2</span> 点击底部 <b>分享按钮</b> <span style="font-size:20px">⎋</span></div>
      <div class="step"><span class="step-num">3</span> 滑动找到 <b>「添加到主屏幕」</b></div>
      <div class="step"><span class="step-num">4</span> 点击右上角 <b>「添加」</b> 完成</div>
    </div>
    <p style="font-size:13px;color:#8e8e93;text-align:center;margin-top:12px">之后桌面会出现小说阅读App图标，点击即可使用</p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/bundle.js"></script>
<script src="js/offline-seed-1.js"></script>
<script src="js/offline-seed-2.js"></script>
<script src="js/offline-seed-3.js"></script>
<script src="js/offline-seed-4.js"></script>
<script src="js/offline-seed-5.js"></script>
<script src="js/offline-seed-6.js"></script>
<script src="js/offline-seed-7.js"></script>
<script src="js/offline-seed-8.js"></script>
<script src="js/offline-seed-9.js"></script>
<script src="js/offline-seed-10.js"></script>
<script src="js/offline-seed-11.js"></script>
<script src="js/offline-seed-12.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

</script>

</body>
</html>
